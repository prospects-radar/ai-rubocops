# Standalone config for the ai-rubocops gem.
#
# This gem lives inside the ProspectsRadar checkout, so RuboCop's project root
# resolves to the application, not to this directory. Two consequences:
#
#   * without this file, the application's .rubocop.yml is used, and it
#     inherits from gems (rubocop-rails-omakase) that are not in this gem's
#     bundle;
#   * even with this file, RuboCop still reads the application's
#     AllCops/Exclude from "above". The `.rubocop` arguments file next to this
#     one passes --ignore-parent-exclusion to stop that.
#
# Keep this config self-contained — no inherit_from pointing upwards.

inherit_from: .rubocop_todo.yml

AllCops:
  TargetRubyVersion: 3.2
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "spec/fixtures/**/*"

# House style matches the application: double quotes everywhere.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

# Cop classes are documented in docs/cops_reference.md and in each cop's MSG.
Style/Documentation:
  Enabled: false

# The entry point is named after the gem: ai-rubocops.
Naming/FileName:
  Exclude:
    - "lib/ai-rubocops.rb"

Gemspec/DevelopmentDependencies:
  EnforcedStyle: gemspec

# Node pattern matchers and `on_send` handlers are naturally long.
Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 200

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

Metrics/ModuleLength:
  Exclude:
    - "spec/**/*"

Layout/LineLength:
  Max: 120
